[package]
name = "voice-bridge"
version = "0.3.0"
description = "A local Silero voice bridge"
authors = ["Voice Bridge"]
edition = "2021"

[lib]
name = "voice_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.1", features = [] }
tauri-plugin-shell = "2.3.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
